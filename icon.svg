<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background dengan rounded corner -->
  <rect width="512" height="512" rx="80" fill="#0b0b0d"/>

  <!-- Gold accent gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#c9a94a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c9a94a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6c76a"/>
      <stop offset="100%" stop-color="#c9a94a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#glow)"/>

  <!-- Chart bars (rising market) -->
  <g transform="translate(96, 120)">
    <rect x="0" y="180" width="40" height="100" fill="url(#goldFill)" opacity="0.6"/>
    <rect x="60" y="120" width="40" height="160" fill="url(#goldFill)" opacity="0.8"/>
    <rect x="120" y="60" width="40" height="220" fill="url(#goldFill)"/>
    <rect x="180" y="20" width="40" height="260" fill="url(#goldFill)"/>
    <rect x="240" y="80" width="40" height="200" fill="url(#goldFill)" opacity="0.85"/>
    <rect x="300" y="40" width="40" height="240" fill="url(#goldFill)" opacity="0.95"/>

    <!-- Trend line -->
    <polyline points="20,180 80,120 140,60 200,20 260,80 320,40"
              stroke="#e6c76a" stroke-width="3" fill="none"
              stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

    <!-- Up arrow at the end -->
    <polygon points="320,40 308,52 332,52" fill="#e6c76a"/>
  </g>

  <!-- "M" letter overlay (Market) -->
  <text x="256" y="440" font-family="serif" font-size="72" font-weight="700"
        text-anchor="middle" fill="#c9a94a" font-style="italic">
    Market
  </text>
</svg>
